[workspace]
resolver = "3"
members = [
    "crates/qm-core",
    "crates/qm-store",
    "crates/qm-search",
    "crates/qm-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
qm-core = { path = "crates/qm-core", version = "0.1.0" }
qm-store = { path = "crates/qm-store", version = "0.1.0" }
qm-search = { path = "crates/qm-search", version = "0.1.0" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
object_store = { version = "0.12", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.26"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
